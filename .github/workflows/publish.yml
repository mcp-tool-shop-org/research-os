name: Publish to npm

# Three trigger surfaces:
#   1. push: tags v*.*.* — tag-driven auto-release. Push the tag, the workflow
#      verifies tag-vs-package.json, runs the ship gate, publishes to npm with
#      provenance, then creates the GitHub release with notes pulled from
#      CHANGELOG.md.
#   2. release: published — preserved for the manual UI flow. When a release
#      is created from the GitHub UI rather than a tag push, this branch
#      handles the publish. Skips the auto-create-release step.
#   3. workflow_dispatch — operator escape hatch with explicit tag input.
#      Used when the workflow was added AFTER the tag was already pushed
#      (e.g., the v0.13.1 release-spine bootstrap).
on:
  push:
    tags:
      - 'v*.*.*'
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Git tag to publish (e.g., v0.13.1). Must match package.json version."
        required: true
        type: string

concurrency:
  group: publish-${{ github.workflow }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    # B-TESTS-CI: bound a wedged run (concurrency here is cancel-in-progress:false,
    # so a hung publish would otherwise occupy a slot up to the 6h default cap).
    timeout-minutes: 20
    permissions:
      # id-token: write — required for npm --provenance (OIDC → Sigstore).
      # contents: write — required for gh release create on the tag-push path.
      contents: write
      id-token: write
    steps:
      - name: Assert Node major version (20.x or 22.x)
        run: |
          V=$(node --version)
          case "$V" in
            v20.*|v22.*) echo "Node $V ok";;
            *) echo "::error::Node $V not 20.x or 22.x"; exit 1;;
          esac

      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: "22"
          registry-url: https://registry.npmjs.org

      - name: Install
        run: npm ci

      # Tag-vs-package.json verify gate. Three trigger sources resolve to one
      # tag string; we always compare against "v$(package.json.version)". A
      # mismatch fails BEFORE publish so an out-of-sync tag can never produce
      # an npm artifact.
      - name: Verify tag matches package.json version
        id: verify
        run: |
          PKG_VERSION=$(node -p "require('./package.json').version")
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          EXPECTED="v$PKG_VERSION"
          if [ "$TAG" != "$EXPECTED" ]; then
            echo "::error::Tag $TAG does not match package.json version $EXPECTED"
            exit 1
          fi
          echo "Tag $TAG matches package.json $PKG_VERSION"
          echo "version=$PKG_VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Verify gate (build + typecheck + lint + test)
        run: npm run verify

      # B-TESTS-CI-002: the two irreversible release actions are `npm publish`
      # (below) then `gh release create` (further down). If publish succeeds but
      # the release step fails (transient gh/API error), a naive re-run would die
      # here because the version is already on the registry. Detect that case and
      # SKIP publish so the re-run proceeds straight to creating the GitHub release
      # — making the release job idempotent across a split failure.
      #
      # NAMED COMPENSATOR (manual, if the automated re-run is unavailable):
      #   npm: a published version cannot be un-published cleanly after 72h; treat
      #     it as committed. To complete a split release by hand, run:
      #       gh release create <tag> --title <tag> --verify-tag \
      #         --notes-file <CHANGELOG section>   (or --generate-notes)
      #   Owner: release author (the human who pushed the tag).
      - name: Check whether this version is already on the registry
        id: published
        run: |
          NAME=$(node -p "require('./package.json').name")
          VER="${{ steps.verify.outputs.version }}"
          if npm view "$NAME@$VER" version >/dev/null 2>&1; then
            echo "::warning::$NAME@$VER is already published — skipping npm publish (split-failure re-run path); proceeding to GitHub release"
            echo "already=true" >> "$GITHUB_OUTPUT"
          else
            echo "already=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish to npm (with provenance)
        if: steps.published.outputs.already != 'true'
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      # Auto-create a GitHub release on the tag-push path. We extract the
      # version's section from CHANGELOG.md (between "## [<version>]" and the
      # next "## " heading) and pass it as the release body. Skipped when the
      # trigger is `release: published` (the release already exists).
      #
      # If extraction fails for any reason we fall back to --generate-notes,
      # which uses GitHub's auto-generated changelog from commits.
      - name: Extract CHANGELOG section for this version
        if: github.event_name != 'release'
        id: changelog
        run: |
          VERSION="${{ steps.verify.outputs.version }}"
          # Capture the section between this version's heading and the next
          # "## " heading. B-TESTS-CI-001: compare the heading's version token
          # by LITERAL string equality, NOT a regex interpolation — a regex
          # "## \\[?$ver\\]?" treats '.' as any-char and is unanchored on the
          # right, so e.g. ver=0.13.1 would also match "## [0.13.10]" and a
          # wrong section could be shipped as the release notes.
          SECTION=$(awk -v ver="$VERSION" '
            /^## / {
              if (found) { exit }            # next section heading: stop
              hdr = $0
              sub(/^## +/, "", hdr)          # drop the "## " prefix
              gsub(/[][]/, "", hdr)          # drop [ and ] around the version
              split(hdr, a, /[ \t]/)         # first token is the version
              if (a[1] == ver) { found = 1 } # exact match only
              next                           # never print the heading line
            }
            found { print }
          ' CHANGELOG.md)
          if [ -z "$SECTION" ]; then
            echo "::warning::No CHANGELOG section found for v${VERSION} — release body will fall back to --generate-notes"
            echo "has_section=false" >> "$GITHUB_OUTPUT"
          else
            printf "%s\n" "$SECTION" > .release-notes.md
            echo "has_section=true" >> "$GITHUB_OUTPUT"
            echo "Resolved CHANGELOG section ($(wc -l < .release-notes.md) lines)"
          fi

      - name: Create GitHub release (section present)
        if: github.event_name != 'release' && steps.changelog.outputs.has_section == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.verify.outputs.tag }}"
          gh release create "$TAG" \
            --title "$TAG" \
            --notes-file .release-notes.md \
            --verify-tag

      - name: Create GitHub release (fallback to auto-notes)
        if: github.event_name != 'release' && steps.changelog.outputs.has_section != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.verify.outputs.tag }}"
          gh release create "$TAG" \
            --title "$TAG" \
            --generate-notes \
            --verify-tag
