name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20, 22]

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Coverage
        if: matrix.node-version == 20
        run: npm run test:coverage

      # Advisory, non-blocking: `npm audit` queries a remote feed that mutates
      # independently of this repo, so a newly-published advisory must not red
      # an unchanged-lockfile build (and thereby block merges/releases). The
      # real exploit surface here is unreachable — research-os is an MCP *client*
      # that never starts an HTTP server, and cheerio is only used via .load()
      # on already-fetched bodies. Surfaced as a warning; triaged out-of-band.
      - name: Dependency audit (advisory)
        continue-on-error: true
        run: npm audit --audit-level=high
